<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>PQ · 243 Dashboard · IKI‑UC‑213 Cluster</title>

<style>
    body {
        background:#000;
        color:#0f0;
        font-family:monospace;
        margin:0;
        padding:20px;
    }
    canvas {
        border:1px solid #0f0;
        margin-bottom:20px;
    }
</style>
</head>

<body>

<h1>PQ · 243 Dashboard · IKI‑UC‑213 Cluster</h1>

<!-- PQ‑Root‑243 Dashboard -->
<canvas id="pq243" width="600" height="200"></canvas>

<!-- IKI‑UC‑213 Cluster -->
<canvas id="cluster213" width="600" height="200"></canvas>

<!-- PQ‑Vector Datenleck -->
<canvas id="pqLeak" width="600" height="200"></canvas>

<script type="module">
import { PALAISE_RESPO } from "./PALAISE.RESPO.js";
import { PQ_RUN } from "./PQ.js";
import { RESPO_WHIRL } from "./RESPO_Whirl.js";

/* ============================================================
   PQ‑Root‑243 Dashboard
============================================================ */
async function renderPQ243(){
    const truth = await PALAISE_RESPO.truth("BEN");
    const root = truth.pqVector.D0;

    const c = document.getElementById("pq243");
    const ctx = c.getContext("2d");

    ctx.clearRect(0,0,600,200);

    ctx.fillStyle = "#0f0";
    ctx.fillText("PQ‑Root: " + root, 20, 40);

    ctx.fillStyle = "#ff0";
    ctx.fillRect(20, 80, root, 20);
}

setInterval(renderPQ243, 200);

/* ============================================================
   IKI‑UC‑213 Cluster
============================================================ */
async function renderCluster213(){
    const truth = await PALAISE_RESPO.truth("BEN");
    const sys = 213;

    const c = document.getElementById("cluster213");
    const ctx = c.getContext("2d");

    ctx.clearRect(0,0,600,200);

    ctx.fillStyle = "#0f0";
    ctx.fillText("IKI‑UC‑SYS: 213", 20, 40);

    ctx.strokeStyle = "#0f0";
    ctx.strokeRect(20, 80, 100, 100); // Cluster
    ctx.beginPath();
    ctx.moveTo(150, 80);
    ctx.lineTo(250, 180); // Kette
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(350, 130, 50, 0, Math.PI*2); // Pool
    ctx.stroke();
}

setInterval(renderCluster213, 200);

/* ============================================================
   PQ‑Vector Datenleck
============================================================ */
async function renderPQLeak(){
    const truth = await PALAISE_RESPO.truth("BEN");
    const v = truth.pqVector;

    const c = document.getElementById("pqLeak");
    const ctx = c.getContext("2d");

    ctx.clearRect(0,0,600,200);

    ctx.fillStyle = "#0f0";
    ctx.fillText("PQ‑Vector Datenleck:", 20, 40);

    const arr = [v.D0, v.D1, v.D2, v.D3, v.D4, v.D5];

    arr.forEach((val, i)=>{
        ctx.fillStyle = "#0f0";
        ctx.fillRect(20 + i*100, 80, val*50, 20);
        ctx.fillText("D"+i+": "+val.toFixed(3), 20 + i*100, 120);
    });
}

setInterval(renderPQLeak, 200);

/* ============================================================
   RESPO‑Kanal‑Switcher
============================================================ */
async function RESPO_SWITCH(){
    const truth = await PALAISE_RESPO.truth("BEN");
    const root = truth.pqVector.D0;

    if(root < 100){
        console.log("RESPO: PALAISE_RESPO");
    }
    else if(root < 200){
        console.log("RESPO: RESPO_ARG_SCAN");
    }
    else if(root < 300){
        console.log("RESPO: RESPO_Whirl");
        RESPO_WHIRL(truth);
    }
    else {
        console.log("RESPO: RESPO_Whirl + NC_HUB_ALL");
    }
}

setInterval(RESPO_SWITCH, 200);

</script>

</body>
</html>
