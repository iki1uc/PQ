<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>iki1uc · 4D‑MASTER‑RUNTIME · NC · PQ · TMP · HUB · NET</title>

<style>
body {
    background:#000;
    color:#0f0;
    font-family:monospace;
    padding:20px;
}
.panel {
    border:1px solid #0f0;
    padding:10px;
    margin-bottom:20px;
    background:#111;
}
h2 { color:#6cf; }
canvas {
    border:1px solid #0f0;
    margin-bottom:20px;
}
pre { white-space:pre-wrap; }
</style>
</head>

<body>

<h1>iki1uc · 4D‑MASTER‑RUNTIME</h1>

<!-- NC Quantum Spin -->
<div class="panel">
    <h2>NC‑Quantum‑Spin‑Animation</h2>
    <canvas id="ncSpin" width="600" height="200"></canvas>
    <pre id="nc"></pre>
</div>

<script type="module">
import { NC_QUANTUM } from "./NC/NC_Quantum.js";
import { PQ_HYPER } from "./PQ/PQ_Hyper.js";
import { TMP_GHOST } from "./TMP/TMP_Ghost.js";
import { HUB_AI } from "./HUB/HUB_AI.js";
import { NET_OVERDRIVE } from "./NET/NET_Overdrive.js";

const nc = NC_QUANTUM();
const pq = PQ_HYPER(nc);
const tmp = TMP_GHOST(pq);
const hub = HUB_AI(nc, pq, tmp);
const net = NET_OVERDRIVE(nc, pq, tmp, hub);

/* ============================================================
   NC‑Quantum‑Spin‑Animation (4D‑Upgrade)
============================================================ */
function renderNC(){
    const c = document.getElementById("ncSpin");
    const ctx = c.getContext("2d");
    ctx.clearRect(0,0,600,200);

    // Sphere
    ctx.strokeStyle="#0f0";
    ctx.beginPath();
    ctx.arc(300,100,60,0,Math.PI*2);
    ctx.stroke();

    // Quantum spin particle
    ctx.save();
    ctx.translate(300,100);
    ctx.rotate((nc.spin+=0.03));
    ctx.fillStyle="#6f6";
    ctx.fillRect(60,0,12,12);
    ctx.restore();

    // Energy pulse
    ctx.fillStyle="#0f0";
    ctx.fillRect(20,180, nc.energy/10, 5);
}
setInterval(renderNC, 30);

/* ============================================================
   PQ‑Hyperparallel‑Flow‑Graph (4D‑Upgrade)
============================================================ */
function renderPQ(){
    const c = document.getElementById("pqFlow");
    const ctx = c.getContext("2d");
    ctx.clearRect(0,0,600,200);

    ctx.fillStyle="#6cf";
    ctx.fillRect(20,150-pq.load, pq.load*4, 20);

    ctx.fillStyle="#0ff";
    ctx.fillText("Threads: " + pq.threads, 20, 40);
}
setInterval(renderPQ, 200);

/* ============================================================
   TMP‑Ghost‑Echo‑Wave (4D‑Upgrade)
============================================================ */
function renderTMP(){
    const c = document.getElementById("tmpEcho");
    const ctx = c.getContext("2d");
    ctx.clearRect(0,0,600,200);

    ctx.strokeStyle="#f0f";
    ctx.beginPath();
    for(let x=0; x<600; x++){
        const y = 100 + Math.sin((x+tmp.echo)/15)*50;
        ctx.lineTo(x,y);
    }
    ctx.stroke();
}
setInterval(renderTMP, 120);

/* ============================================================
   HUB‑ALL‑AI‑Pulse‑Map (4D‑Upgrade)
============================================================ */
function renderHUB(){
    const c = document.getElementById("hubPulse");
    const ctx = c.getContext("2d");
    ctx.clearRect(0,0,600,200);

    ctx.fillStyle="#ff0";
    ctx.fillRect(20, 100, hub.pulse/1.5, 20);

    ctx.fillStyle="#fff";
    ctx.fillText("AI‑Mode: " + hub.mode, 20, 40);
}
setInterval(renderHUB, 150);

/* ============================================================
   NET‑LINK‑NC‑Fusion‑Sphere (4D‑Upgrade)
============================================================ */
function renderNET(){
    const c = document.getElementById("netSphere");
    const ctx = c.getContext("2d");
    ctx.clearRect(0,0,600,200);

    ctx.strokeStyle="#0ff";
    ctx.beginPath();
    ctx.arc(300,100, net.quantum/40, 0, Math.PI*2);
    ctx.stroke();

    ctx.fillStyle="#0ff";
    ctx.fillText("Fusion: " + net.fusion, 20, 40);
}
setInterval(renderNET, 180);


</script>

</body>
</html>
