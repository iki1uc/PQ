<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>PQ · Symbiose · 213 ↔ 243</title>

<style>
    body {
        background:#000;
        color:#0f0;
        font-family:monospace;
        margin:0;
        padding:20px;
    }
    canvas {
        border:1px solid #0f0;
        margin-bottom:20px;
    }
    #log {
        background:#111;
        border:1px solid #0f0;
        padding:10px;
        height:150px;
        overflow-y:auto;
        margin-top:20px;
    }
</style>
</head>

<body>

<h1>PQ · Symbiose · 213 ↔ 243</h1>

<!-- PQ‑213 SYS -->
<canvas id="pq213" width="600" height="200"></canvas>

<!-- PQ‑243 ROOT -->
<canvas id="pq243" width="600" height="200"></canvas>

<!-- Hochzeit / Connect -->
<canvas id="connect" width="600" height="200"></canvas>

<!-- Runtime Log -->
<div id="log"></div>

<script type="module">
import { PALAISE_RESPO } from "./PALAISE.RESPO.js";
import { RESPO_WHIRL } from "./RESPO_Whirl.js";

/* ============================================================
   PQ‑Symbiose Runtime
============================================================ */

function log(msg){
    const box = document.getElementById("log");
    box.innerHTML += msg + "<br>";
    box.scrollTop = box.scrollHeight;
}

/* ============================================================
   PQ‑213 (WHIRL_SYS)
============================================================ */
async function render213(){
    const truth = await PALAISE_RESPO.truth("BEN");
    truth.pqVector.D0 = 213; // Emulation

    const whirl = RESPO_WHIRL(truth);

    const c = document.getElementById("pq213");
    const ctx = c.getContext("2d");

    ctx.clearRect(0,0,600,200);

    ctx.fillText("PQ‑213 · WHIRL_SYS", 20, 40);

    ctx.fillStyle = "#0f0";
    ctx.fillRect(20, 80, whirl.root, 20);

    log("213 → SYS send: " + whirl.seq);
}

setInterval(render213, 300);

/* ============================================================
   PQ‑243 (WHIRL_PQ)
============================================================ */
async function render243(){
    const truth = await PALAISE_RESPO.truth("BEN");
    truth.pqVector.D0 = 243; // Emulation

    const whirl = RESPO_WHIRL(truth);

    const c = document.getElementById("pq243");
    const ctx = c.getContext("2d");

    ctx.clearRect(0,0,600,200);

    ctx.fillText("PQ‑243 · WHIRL_PQ", 20, 40);

    ctx.fillStyle = "#ff0";
    ctx.fillRect(20, 80, whirl.root, 20);

    log("243 → ROOT send: " + whirl.seq);
}

setInterval(render243, 300);

/* ============================================================
   Hochzeit / Connect rdy → fix → fit → fi(n) → render.load
============================================================ */
let stage = 0;

function renderConnect(){
    const c = document.getElementById("connect");
    const ctx = c.getContext("2d");

    ctx.clearRect(0,0,600,200);

    const stages = ["rdy", "fix", "fit", "fi(n)", "render.load"];

    ctx.fillText("Hochzeit 213 ↔ 243", 20, 40);
    ctx.fillText("Stage: " + stages[stage], 20, 80);

    log("Connect: " + stages[stage]);

    stage = (stage + 1) % stages.length;
}

setInterval(renderConnect, 800);

/* ============================================================
   Fehler / Miss / Fail / Help / Scan / Ghost / dx13.room
============================================================ */

function runtimeEvents(){
    const events = ["miss", "fail", "help", "scan", "ghost", "dx13.room"];
    const pick = events[Math.floor(Math.random()*events.length)];
    log("Event: " + pick);
}

setInterval(runtimeEvents, 1500);

</script>

</body>
</html>
