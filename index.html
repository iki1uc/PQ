<pre id="nc"></pre>
<pre id="pq"></pre>
<pre id="tmp"></pre>
<pre id="hub"></pre>
<pre id="fusion"></pre>

<script type="module">
import { NET_LINK_NC } from "./NET_LINK_NC.js";
import { NC_MATRIX_VISUALIZER } from "./NC_MATRIX_VISUALIZER.js";
import { PQ_PARALLEL_MONITOR } from "./PQ_PARALLEL_MONITOR.js";
import { TMP_WHIRL_VIEWER } from "./TMP_WHIRL_VIEWER.js";
import { HUB_ALL_DASHBOARD } from "./HUB_ALL_DASHBOARD.js";
import { NET_LINK_NC_FUSION } from "./NET_LINK_NC_FUSION.js";

const net = NET_LINK_NC.init();

const ncVis = NC_MATRIX_VISUALIZER(net.nc);
const pqMon = PQ_PARALLEL_MONITOR(net.pq);
const tmpView = TMP_WHIRL_VIEWER(net.tmp);
const hubDash = HUB_ALL_DASHBOARD(net.nc, net.pq, net.tmp, net.respo);
const fusion = NET_LINK_NC_FUSION.init(net.nc, net.pq, net.tmp, net.respo);

document.getElementById("nc").textContent = JSON.stringify(ncVis, null, 2);
document.getElementById("pq").textContent = JSON.stringify(pqMon, null, 2);
document.getElementById("tmp").textContent = JSON.stringify(tmpView, null, 2);
document.getElementById("hub").textContent = JSON.stringify(hubDash, null, 2);
document.getElementById("fusion").textContent = JSON.stringify(fusion, null, 2);
</script>
